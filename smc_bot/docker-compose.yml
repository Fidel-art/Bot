services:
  # Backend API Service (Dashboard)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smc_bot_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your-secret-key-change-in-production
      - DATABASE_PATH=/app/data/bot_dashboard.db
      - LOG_LEVEL=INFO
      - MT5_BRIDGE_URL=http://host.docker.internal:8765
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backend:/app/backend
      - ./mt5_proxy:/app/mt5_proxy
    networks:
      - smc_network
    restart: unless-stopped
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - database
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smc_bot_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
      - NODE_ENV=development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - smc_network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  # Database Service (volume holder for SQLite)
  database:
    image: alpine:latest
    container_name: smc_bot_database
    volumes:
      - ./data:/data
      - ./database:/database
    networks:
      - smc_network
    command: tail -f /dev/null
    restart: unless-stopped

  # Trading Bot Core (runs in Docker, connects to MT5 via bridge)
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: smc_bot_core
    environment:
      - MT5_BRIDGE_URL=http://host.docker.internal:8765
      - MT5_LOGIN=${MT5_LOGIN:-}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - MT5_SERVER=${MT5_SERVER:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./mt5_proxy:/app/mt5_proxy
    networks:
      - smc_network
    restart: unless-stopped
    command: python bot_run.py
    depends_on:
      - database
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  smc_network:
    driver: bridge

volumes:
  data:
    driver: local
  logs:
    driver: local
