version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smc_bot_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your-secret-key-change-in-production
      - DATABASE_PATH=/app/data/bot_dashboard.db
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backend:/app/backend
    networks:
      - smc_network
    restart: unless-stopped
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - database

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smc_bot_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - smc_network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  # Database Service (SQLite doesn't need separate container, but we create a service for clarity)
  database:
    image: alpine:latest
    container_name: smc_bot_database
    volumes:
      - ./data:/data
      - ./database:/database
    networks:
      - smc_network
    command: tail -f /dev/null  # Keep container running
    restart: unless-stopped

  # Trading Bot Core (Optional - uncomment to run bot in container)
  # bot:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.bot
  #   container_name: smc_bot_core
  #   environment:
  #     - MT5_LOGIN=${MT5_LOGIN}
  #     - MT5_PASSWORD=${MT5_PASSWORD}
  #     - MT5_SERVER=${MT5_SERVER}
  #   volumes:
  #     - ./data:/app/data
  #     - ./logs:/app/logs
  #     - ./config:/app/config
  #   networks:
  #     - smc_network
  #   restart: unless-stopped
  #   command: python main.py

networks:
  smc_network:
    driver: bridge

volumes:
  data:
    driver: local
  logs:
    driver: local
